name: 🎓 Erro nos dados de grade ou oferta
description: Pré-requisito errado, disciplina faltando, horário incorreto
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Os dados podem ter erros de extração, e a oferta do semestre é um
        snapshot estático, então pode estar desatualizada.

        **Inclua a fonte oficial sempre que possível.** Isso torna a correção trivial.

  - type: dropdown
    id: kind
    attributes:
      label: Que tipo de erro?
      options:
        - Pré-requisito errado ou faltando
        - Disciplina faltando na grade
        - Créditos ou carga horária incorretos
        - Horário ou professor errado na oferta
        - Turma faltando na oferta do semestre
        - Outro
    validations:
      required: true

  - type: input
    id: code
    attributes:
      label: Código da disciplina
      placeholder: "Ex.: DCC001"
    validations:
      required: true

  - type: input
    id: course
    attributes:
      label: Curso / programa
      placeholder: "Ex.: Ciência da Computação"
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: O que a fonte oficial diz, e o que o app mostra?
      description: Descreva a divergência. Se puder, cole o print da fonte oficial (borrando seus dados pessoais).
      placeholder: |
        O app mostra: DCC001 sem pré-requisitos
        A fonte oficial diz: DCC001 exige MAT001
    validations:
      required: true
